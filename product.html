<style>

/* ================= BREADCRUMB ================= */

.breadcrumb-bar{
    padding:22px 8%;
    border-bottom:1px solid var(--line);
}

.breadcrumb{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    font-size:13px;
    color:#8a8378;
}

.breadcrumb a{
    color:#8a8378;
    text-decoration:none;
}

.breadcrumb a:hover{
    color:var(--forest-mid);
}

.breadcrumb .current{
    color:var(--forest-deep);
    font-weight:700;
}


/* ================= LAYOUT ================= */

.product-page{
    width:88%;
    max-width:1200px;
    margin:56px auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:64px;
}

@media(max-width:860px){
    .product-page{
        grid-template-columns:1fr;
        gap:36px;
        margin:36px auto;
    }
}


/* ================= GALLERY ================= */

.product-gallery .main-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:20px;
    overflow:hidden;
    background:#f3f2ee;
}

.product-gallery .main-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity .2s ease;
}

.product-gallery .main-image img.swapping{
    opacity:0;
}

.thumbnail-row{
    display:flex;
    gap:14px;
    margin-top:16px;
}

.thumb{
    width:84px;
    height:84px;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    background:#f3f2ee;
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.thumb:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 16px rgba(16,37,23,.12);
}

.thumb.active,
.thumb:hover{
    border-color:var(--clay);
}

.thumb.active{
    box-shadow:0 8px 16px rgba(181,123,69,.2);
}


/* ================= COMFORT SCALE ================= */

.comfort-scale{
    margin-bottom:30px;
    max-width:52ch;
}

.comfort-scale-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    margin-bottom:12px;
    font-size:13px;
    color:#6b6357;
}

.comfort-scale-head span{
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
}

.comfort-scale-head strong{
    color:var(--forest-deep);
    font-size:14px;
}

.comfort-scale-bar{
    position:relative;
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--sage), var(--forest-bright), var(--forest-deep));
}

.comfort-scale-dot{
    position:absolute;
    top:50%;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#fff;
    border:4px solid var(--clay);
    box-shadow:0 2px 8px rgba(16,37,23,.25);
    transform:translate(-50%,-50%);
}

.comfort-scale-ends{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:13px;
    font-weight:700;
    color:#6b6357;
}


/* ================= GALLERY FEATURES (Why Choose This Product) ================= */

.gallery-features{
    margin-top:24px;
    background:linear-gradient(135deg, var(--sage-tint), #fff);
    border:1px solid var(--sage);
    border-radius:18px;
    padding:24px 26px;
}

.gallery-features h3{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:var(--forest-deep);
    margin-bottom:16px;
}

.feature-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.feature-list li{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.feature-list li i{
    color:var(--forest-mid);
    font-size:15px;
    margin-top:2px;
    flex-shrink:0;
}

.feature-list li span{
    font-size:14.5px;
    font-weight:700;
    color:#2f2b23;
    line-height:1.5;
}


/* ================= PRODUCT INFO ================= */

.product-category-tag{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    color:var(--forest-mid);
    background:var(--sage-tint);
    padding:6px 14px;
    border-radius:30px;
    margin-bottom:16px;
}

.product-info h1{
    font-family:var(--font-display);
    font-size:clamp(28px,3.2vw,38px);
    font-weight:600;
    color:var(--forest-deep);
    margin-bottom:12px;
}

.rating-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:#e0a53c;
    font-size:16px;
    margin-bottom:18px;
}

.rating-row span{
    color:#8a8378;
    font-size:14px;
    font-weight:600;
}

.price-row{
    font-size:30px;
    font-weight:800;
    color:var(--clay);
    margin-bottom:8px;
}

.stock{
    color:var(--forest-mid);
    font-weight:700;
    font-size:14px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    gap:6px;
}

.description{
    color:#4a453c;
    line-height:1.8;
    margin-bottom:30px;
    max-width:52ch;
}

.quantity-row{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:26px;
}

.quantity{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
}

.quantity button{
    width:42px;
    height:44px;
    border:none;
    background:#fff;
    font-size:18px;
    cursor:pointer;
    color:var(--forest-deep);
}

.quantity button:hover{
    background:var(--sage-tint);
}

.quantity input{
    width:48px;
    height:44px;
    text-align:center;
    border:none;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    font-size:15px;
    font-weight:700;
}

.buttons{
    display:flex;
    gap:16px;
    margin-bottom:36px;
    flex-wrap:wrap;
}

.buttons .btn{
    flex:1;
    min-width:160px;
    text-align:center;
}

.buy-btn{
    background:var(--clay);
    color:#fff;
}

.buy-btn:hover{
    background:#9c6737;
}

.cart-btn{
    background:var(--forest-deep);
    color:#fff;
}

.cart-btn:hover{
    background:var(--forest);
}

.info-block{
    padding-top:24px;
    border-top:1px solid var(--line);
    margin-top:24px;
}

.info-block h3{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    margin-bottom:14px;
}

.info-block ul{
    list-style:none;
}

.info-block li{
    padding:7px 0;
    font-size:14px;
    color:#4a453c;
    display:flex;
    align-items:center;
    gap:10px;
}

.info-block li::before{
    content:"\f00c";
    font-family:"Font Awesome 6 Free";
    font-weight:900;
    font-size:11px;
    color:var(--forest-mid);
}

.info-block p{
    font-size:14px;
    color:#4a453c;
}


/* ================= REVIEWS ================= */

.reviews-section{
    width:88%;
    max-width:900px;
    margin:60px auto 0;
}

.reviews-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:30px;
}

.reviews-header h2{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    color:var(--forest-deep);
}

.reviews-header .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    padding:11px 22px;
    background:#25D366;
}

.reviews-header .btn:hover{
    background:#1ebe5a;
}

.reviews-list{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.no-reviews{
    background:var(--sage-tint);
    border-radius:14px;
    padding:30px;
    text-align:center;
}

.no-reviews p{
    color:var(--forest-deep);
    font-weight:600;
}

.no-reviews-sub{
    font-weight:400 !important;
    color:#6b6357 !important;
    font-size:14px;
    margin-top:4px;
}

.review-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 24px;
}

.review-top{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:12px;
}

.review-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--forest);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:15px;
    flex-shrink:0;
}

.review-name{
    font-weight:700;
    font-size:14.5px;
    color:var(--forest-deep);
}

.review-stars{
    color:#e0a53c;
    font-size:13px;
    letter-spacing:1px;
}

.review-date{
    margin-left:auto;
    font-size:12.5px;
    color:#a39c8e;
}

.review-text{
    color:#4a453c;
    font-size:14.5px;
    line-height:1.7;
}


/* ================= RELATED ================= */

.related{
    width:88%;
    max-width:1200px;
    margin:20px auto 100px;
}

.related h2{
    font-family:var(--font-display);
    font-size:28px;
    font-weight:600;
    margin-bottom:26px;
}

.related-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:24px;
}

.related-card{
    text-decoration:none;
    color:inherit;
    display:block;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(16,37,23,.06);
    transition:transform .25s ease, box-shadow .25s ease;
}

.related-card:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 32px rgba(16,37,23,.1);
}

.related-card .related-image{
    aspect-ratio:1/1;
    background:#f3f2ee;
    overflow:hidden;
}

.related-card .related-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.related-card .related-info{
    padding:16px 18px 20px;
}

.related-card .related-category{
    font-size:12px;
    font-weight:700;
    color:var(--forest-mid);
    margin-bottom:4px;
}

.related-card h3{
    font-size:16px;
    font-weight:700;
    margin-bottom:6px;
}

.related-card .related-price{
    color:var(--clay);
    font-weight:700;
}


/* ================= NOT FOUND ================= */

.not-found{
    width:88%;
    max-width:600px;
    margin:100px auto;
    text-align:center;
}

.not-found h1{
    font-family:var(--font-display);
    font-size:32px;
    margin-bottom:14px;
}

.not-found p{
    color:#6b6357;
    margin-bottom:26px;
}


/* ================= TOAST ================= */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:var(--forest-deep);
    color:#fff;
    padding:14px 26px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:2000;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* ================= ORDER MODAL ================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(16,37,23,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:3000;
}

.modal-overlay.open{
    display:flex;
}

.order-modal{
    background:#fff;
    border-radius:20px;
    width:100%;
    max-width:460px;
    max-height:90vh;
    overflow-y:auto;
    padding:32px;
    position:relative;
}

.modal-close{
    position:absolute;
    top:18px;
    right:18px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:var(--sage-tint);
    font-size:16px;
    cursor:pointer;
    color:var(--forest-deep);
}

.modal-close:hover{
    background:var(--sage);
    color:#fff;
}

.order-slip h2{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:600;
    margin-bottom:4px;
}

.order-slip .order-meta{
    font-size:13px;
    color:#8a8378;
    margin-bottom:22px;
}

.order-slip .order-meta strong{
    color:var(--forest-deep);
}

.order-line{
    display:flex;
    gap:14px;
    padding:16px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
}

.order-line img{
    width:64px;
    height:64px;
    border-radius:10px;
    object-fit:cover;
    background:#f3f2ee;
}

.order-line-details{
    flex:1;
}

.order-line-details .name{
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
}

.order-line-details .meta{
    font-size:13px;
    color:#6b6357;
}

.order-totals{
    padding:16px 0;
    font-size:14px;
}

.order-totals .row{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    color:#4a453c;
}

.order-totals .row.total{
    font-size:18px;
    font-weight:800;
    color:var(--forest-deep);
    padding-top:12px;
    margin-top:6px;
    border-top:1px solid var(--line);
}

.order-note{
    background:var(--sage-tint);
    border-radius:12px;
    padding:14px 16px;
    font-size:13.5px;
    color:var(--forest-deep);
    line-height:1.6;
    margin:18px 0 22px;
}

.order-actions{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.whatsapp-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#25D366;
    color:#fff;
}

.whatsapp-btn:hover{
    background:#1ebe5a;
}

.pdf-btn{
    background:#fff;
    color:var(--forest-deep);
    border:1.5px solid var(--line);
}

.pdf-btn:hover{
    border-color:var(--forest-mid);
    color:var(--forest-mid);
}


/* ================= PRINT (order slip only) ================= */

@media print{

    body *{
        visibility:hidden;
    }

    #printArea, #printArea *{
        visibility:visible;
    }

    #printArea{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        padding:20px;
    }

    .modal-close,
    .order-actions{
        display:none !important;
    }

}

</style>

<style>

/* ================= BREADCRUMB ================= */

.breadcrumb-bar{
    padding:22px 8%;
    border-bottom:1px solid var(--line);
}

.breadcrumb{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    font-size:13px;
    color:#8a8378;
}

.breadcrumb a{
    color:#8a8378;
    text-decoration:none;
}

.breadcrumb a:hover{
    color:var(--forest-mid);
}

.breadcrumb .current{
    color:var(--forest-deep);
    font-weight:700;
}


/* ================= ARTICLE HEADER ================= */

.article-header{
    width:min(90%,760px);
    margin:50px auto 0;
    text-align:center;
}

.article-category{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    color:var(--forest-mid);
    background:var(--sage-tint);
    padding:6px 14px;
    border-radius:30px;
    margin-bottom:18px;
}

.article-header h1{
    font-family:var(--font-display);
    font-size:clamp(28px,4.2vw,44px);
    font-weight:600;
    color:var(--forest-deep);
    line-height:1.2;
    margin-bottom:18px;
}

.article-meta{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px 18px;
    font-size:13.5px;
    color:#8a8378;
}

.article-meta span{
    display:flex;
    align-items:center;
    gap:6px;
}


/* ================= HERO IMAGE ================= */

.article-hero{
    width:min(90%,900px);
    margin:36px auto 0;
    border-radius:20px;
    overflow:hidden;
}

.article-hero img{
    width:100%;
    height:auto;
    max-height:440px;
    object-fit:cover;
    display:block;
}


/* ================= ARTICLE BODY ================= */

.article-body{
    width:min(90%,700px);
    margin:46px auto 0;
    color:#3d382f;
    line-height:1.85;
    font-size:16.5px;
}

.article-body p{
    margin-bottom:22px;
}

.article-body h3{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:600;
    color:var(--forest-deep);
    margin:38px 0 16px;
}


/* ================= SHARE ================= */

.article-share{
    width:min(90%,700px);
    margin:20px auto 0;
    padding-top:26px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
}

.article-share span{
    font-size:13px;
    font-weight:700;
    color:#8a8378;
    text-transform:uppercase;
    letter-spacing:.03em;
}

.share-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:10px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
}

.share-btn:hover{
    background:#1ebe5a;
}


/* ================= RELATED ================= */

.related{
    width:min(90%,1000px);
    margin:80px auto 100px;
}

.related h2{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    color:var(--forest-deep);
    margin-bottom:26px;
    text-align:center;
}

.related-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:24px;
}

.related-card{
    text-decoration:none;
    color:inherit;
    display:block;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(16,37,23,.06);
    transition:transform .25s ease, box-shadow .25s ease;
}

.related-card:hover{
    transform:translateY(-6px);
    box-shadow:0 16px 32px rgba(16,37,23,.1);
}

.related-card img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.related-card .related-info{
    padding:16px 18px 20px;
}

.related-card .related-category{
    font-size:12px;
    font-weight:700;
    color:var(--forest-mid);
    margin-bottom:6px;
}

.related-card h3{
    font-size:15.5px;
    font-weight:700;
    line-height:1.4;
}


/* ================= NOT FOUND ================= */

.not-found{
    width:88%;
    max-width:600px;
    margin:100px auto;
    text-align:center;
}

.not-found h1{
    font-family:var(--font-display);
    font-size:32px;
    margin-bottom:14px;
}

.not-found p{
    color:#6b6357;
    margin-bottom:26px;
}

</style>
